# Keycap Legends Configuration

[settings]
font = "Rajdhani"
primary_font_size = 8
secondary_font_size = 3.5
secondary_x_offset = 3.3  # symbol bottom-right
primary_x_offset = -2.4  # main legend top-left
primary_y_offset = 2.4
secondary_y_offset = -3.3
tertiary_font_size = 5
legend_gap = 0.0
vertical_shift = 0.0
tertiary_x_offset = -5.0
# Bambu Studio filament slots (1-based) pre-assigned per part in the 3MF
body_filament = 1
legend_filament = 2
stem_filament = 1
bold_offset = 0.15  # mechanical bold: outward offset in mm

# STEP file sources
# Each entry maps a row name to a path and optional rotation (degrees)
[step_files.row_2]
path = "assets/1u_row_2.step"
stl = "assets/1u Row 2.stl"
has_stem = true

[step_files.row_2_reachy]
path = "assets/1u_row_2_left_reachy.step"
stl = "assets/1u Row 2 Left Reachy.stl"
has_stem = true

[step_files.row_3]
path = "assets/1u_row_3.step"
stl = "assets/1u Row 3.stl"
has_stem = true

[step_files.row_3_dots]
path = "assets/1u_row_3_dots.step"
stl = "assets/1u Row 3 Homing dots.stl"
has_stem = true

[step_files.row_3_reachy]
path = "assets/1u_row_3_reachy.step"
stl = "assets/1u Row 3 Left Reachy.stl"
has_stem = true

[step_files.row_4]
path = "assets/1u_row_4.step"
stl = "assets/1u Row 4.stl"
has_stem = true

[step_files.row_4_reachy]
path = "assets/1u_row_4_reachy.step"
stl = "assets/1u Row 4 Left Reachy.stl"
has_stem = true

[step_files.thumb_mid]
path = "assets/1u_convex.step"
stl = "assets/Convex 1.00u.stl"
has_stem = true

[step_files.thumb_corners]
path = "assets/1u_convex_slanted_right.step"
stl = "assets/Convex 1.00u Slanted Right.stl"
has_stem = true

# Legend definitions by row
# Each legend entry can have:
#   primary         - main character (bottom/center)
#   secondary       - symbol character (top/center)
#   mirror_x        - mirror keycap on X axis (for reachy keys)
#   primary_font    - font override for primary
#   secondary_font  - font override for secondary
#   tertiary        - third character (left side)
#   tertiary_font   - font override for tertiary

[[legends.row_2]]
primary = "Q"
primary_font = "Open Gorton"
primary_font_size = 8
secondary = "`"
secondary_font = "Open Gorton"

